; Red_LED_Panel_8x2 — HUB08 64x16 single-colour (red) LED panel driven by ESP32
; Panel: P3.75, 8x2 grid of 8x8 modules, 74HC595 columns, 74HC138 + 4953 rows, 1/16 scan

[platformio]
default_envs = esp32dev ; plain `pio run -t upload` stays on USB

[env:esp32dev]
platform      = espressif32@6.9.0
board         = esp32dev
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600
extra_scripts = pre:tools/pio_prepare.py

lib_deps =
    adafruit/Adafruit GFX Library@^1.11.9
    tzapu/WiFiManager@2.0.17

build_flags =
    -DDEBUG_LEVEL=3
    -DCORE_DEBUG_LEVEL=0

; Network upload (ArduinoOTA). Flash the OTA-capable firmware once over USB with
; SECRET_OTA_PASSWORD set in include/secrets.h, then from any machine on the LAN:
;   pio run -e esp32dev_ota -t upload
; The password comes from include/secrets.h; set PANEL_OTA_PASSWORD to override
; it (for example with the panel's old password while changing it).
; The default esp32dev partition table already has two 1.25 MB app slots.
[env:esp32dev_ota]
extends         = env:esp32dev
upload_protocol = espota
upload_port     = red-panel-a4ae30.local ; this panel's mDNS name; or pass --upload-port <IP>
build_flags     = ${env:esp32dev.build_flags} -DOTA_UPLOAD_BUILD ; refuse to build without an OTA password
extra_scripts   =
    pre:tools/pio_prepare.py
    post:tools/ota_auth.py
upload_flags    = --port=3232
