; Red_LED_Panel_8x2 — HUB08 64x16 single-colour (red) LED panel driven by ESP32
; Panel: P3.75, 8x2 grid of 8x8 modules, 74HC595 columns, 74HC138 + 4953 rows, 1/16 scan

[env:esp32dev]
platform      = espressif32@6.9.0
board         = esp32dev
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600
extra_scripts = pre:tools/pio_prepare.py

lib_deps =
    adafruit/Adafruit GFX Library@^1.11.9
    tzapu/WiFiManager@2.0.17

build_flags =
    -DDEBUG_LEVEL=3
    -DCORE_DEBUG_LEVEL=0
